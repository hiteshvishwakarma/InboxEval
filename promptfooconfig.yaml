# Promptfoo Configuration for InboxEval
# This file automates running our 13 Super Prompts across Gemini, Claude, and ChatGPT.

description: "InboxEval Cross-Model Verification"

# We pass the prompt exactly as it was generated by the Evolutionary Engine
prompts:
  - "{{Generated_Prompt}}"

# We will test against 3 highly capable models using completely FREE API plans
providers:
  # Gemini API is completely free via Google AI Studio
  - google:gemini-1.5-flash
  # We will use your existing Groq API keys to test Meta's Llama 3
  - id: groq:llama-3.3-70b-versatile
  # And Mistral's Mixtral model, also completely free on Groq
  - id: groq:mixtral-8x7b-32768

# We load the 13 Super Prompts from our CSV dataset
tests:
  - vars: file://data/evaluation_dataset.csv
